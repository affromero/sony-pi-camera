name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.17"
          python-version: ${{ matrix.python }}
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Set up locked dependencies
        run: |
          uv lock --check
          uv sync --frozen --extra ftps
      - name: Run repository hooks
        run: uv run --frozen --extra ftps pre-commit run --all-files --show-diff-on-failure
      - name: Check dashboard JavaScript
        run: node --check camera/camera.js
      - name: Run camera service tests
        run: uv run --frozen --extra ftps python -m unittest discover -s tests -v
      - name: Import optional FTPS receiver
        run: uv run --frozen --extra ftps python -c "from camera.transfer import CameraTransfer"
