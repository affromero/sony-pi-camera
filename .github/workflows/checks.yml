name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.17"
          python-version: ${{ matrix.python }}
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Set up locked dependencies
        run: |
          uv lock --check
          uv sync --frozen --extra ftps
      - name: Run repository hooks
        run: uv run --frozen --extra ftps pre-commit run --all-files --show-diff-on-failure
      - name: Audit locked dependencies
        if: matrix.python == '3.11'
        run: uv audit --locked
      - name: Check dashboard JavaScript
        run: node --check camera/camera.js
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.python == '3.13'
        with:
          node-version: "22"
      - name: Test scheduled AI advice
        if: matrix.python == '3.13'
        working-directory: camera/sidedoor
        run: |
          npm ci
          npm test
      - name: Run camera service tests
        run: uv run --frozen --extra ftps python -m unittest discover -s tests -v
      - name: Import optional FTPS receiver
        run: uv run --frozen --extra ftps python -c "from camera.transfer import CameraTransfer"
