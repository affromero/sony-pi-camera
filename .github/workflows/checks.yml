name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.17"
          python-version: ${{ matrix.python }}
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Set up locked dependencies
        run: |
          uv lock --check
          uv sync --frozen --extra ftps
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install JavaScript dependencies
        run: npm ci --prefix camera/sidedoor
      - name: Install Rust lint components
        run: rustup component add rustfmt clippy
      - name: Run repository hooks
        run: uv run --frozen --extra ftps pre-commit run --all-files --show-diff-on-failure
      - name: Audit locked dependencies
        if: matrix.python == '3.11'
        run: uv audit --locked
      - name: Build browser assets and test the viewer
        if: matrix.python == '3.13'
        working-directory: camera/sidedoor
        run: |
          npm run build
          npm test
      - name: Run camera service tests
        run: uv run --frozen --extra ftps python -m unittest discover -s tests -v
      - name: Build and test the Rust camera backend
        if: matrix.python == '3.13'
        working-directory: camera/rust-preview
        run: |
          sudo apt-get install --yes libgphoto2-dev
          cargo test --locked
          cargo build --locked --release
      - name: Import optional FTPS receiver
        run: uv run --frozen --extra ftps python -c "from camera.transfer import CameraTransfer"
      - name: Verify dashboard scheduling with systemd
        if: matrix.python == '3.13'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          sudo apt-get install --yes python3-pil
          sudo sh camera/install.sh
          uv run --frozen python tests/systemd_schedule_smoke.py
