name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install development tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes pre-commit shellcheck
      - name: Run repository hooks
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Check dashboard JavaScript
        run: node --check camera/camera.js
      - name: Run camera service tests
        run: python3 -m unittest discover -s tests -v
