repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix, lf]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: Python type check (ty)
        entry: uv run --frozen --extra ftps ty check --python-version 3.11 --error-on-warning
        language: system
        files: '(\.(py|pyi)$|^(pyproject\.toml|uv\.lock)$)'
        pass_filenames: false
      - id: eslint
        name: JavaScript lint (ESLint)
        entry: camera/sidedoor/node_modules/.bin/eslint --config camera/sidedoor/eslint.config.mjs --max-warnings 0 camera tests
        language: system
        files: '^(?:(camera|tests)/.*\.(js|mjs)|camera/sidedoor/package(-lock)?\.json)$'
        exclude: '^camera/sidedoor/web/admin-qr\.js$'
        pass_filenames: false
      - id: rustfmt
        name: Rust formatting (rustfmt)
        entry: cargo fmt --manifest-path camera/rust-preview/Cargo.toml --all -- --check
        language: system
        files: '^camera/rust-preview/.*(\.rs|Cargo\.toml|Cargo\.lock)$'
        pass_filenames: false
      - id: clippy
        name: Rust lint (Clippy)
        entry: cargo clippy --manifest-path camera/rust-preview/Cargo.toml --locked --all-targets -- -D warnings
        language: system
        files: '^camera/rust-preview/.*(\.rs|Cargo\.toml|Cargo\.lock)$'
        pass_filenames: false
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: check-file-line-count
        name: Check Python file length
        entry: scripts/hooks/check_file_line_count.sh
        language: script
        types: [python]
      - id: check-directory-file-count
        name: Check directory file count
        entry: scripts/hooks/check_directory_file_count.sh
        args: [--include-regex, '[.](py|sh)$']
        language: script
        pass_filenames: false
        always_run: true
      - id: check-tests-under-tests
        name: Check test locations
        entry: scripts/hooks/check_tests_under_tests.sh
        language: script
        pass_filenames: false
        always_run: true
