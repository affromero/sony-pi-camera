[project]
name = "sony-pi-camera"
authors = [{ name = "Andrés Romero", email = "me@afromero.co" }]
version = "0.0.0"
description = "A Raspberry Pi web dashboard for a USB-connected Sony α7 III"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=11"]

[project.optional-dependencies]
ftps = [
    "pyftpdlib>=2.0.1,<3",
    "pyOpenSSL>=25",
]

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "ruff==0.15.21",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
