<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sony Live Camera</title>
  <link rel="stylesheet" href="/viewer.css">
  <script src="/viewer.js" type="module"></script>
</head>
<body>
  <main>
    <header>
      <h1><a href="/" aria-label="Sony Live Camera home" title="Go to camera home">Sony Live Camera</a></h1>
      <div class="header-actions">
        <button id="lock" type="button" title="End your camera session on this device" hidden>Sign out</button>
      </div>
    </header>
    <form id="unlock" hidden>
      <label for="password">Camera password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
      <button type="submit" id="password-submit" title="Sign in with your camera password">Sign in</button>
      <button type="button" id="login-passkey" title="Use a saved passkey to sign in" hidden>Sign in with a passkey</button>
    </form>
    <section id="passkey-offer" aria-labelledby="passkey-offer-title" hidden>
      <h2 id="passkey-offer-title">Use a passkey next time</h2>
      <p>Sign in with Touch ID, Face ID, or your device PIN.</p>
      <button type="button" id="save-passkey" title="Save a passkey in your device or password manager">Save a passkey</button>
      <button type="button" id="skip-passkey" title="Open the camera without creating a passkey">Continue without a passkey</button>
    </section>
    <form id="invite" hidden>
      <button type="submit" title="Use this invitation to open the live camera and gallery">Accept camera invitation</button>
    </form>
    <p id="status" role="status"></p>
    <section id="camera" hidden>
      <section class="preview-panel" aria-label="Camera preview">
        <div class="preview">
          <img id="preview" alt="Latest camera preview" hidden>
          <p id="preview-status" role="status">Waiting for the camera…</p>
        </div>
        <div class="preview-toolbar">
          <button id="preview-sleep" type="button" title="Stop streaming in this tab until you resume">Sleep preview</button>
        </div>
      </section>
      <section class="gallery" aria-labelledby="photos-heading">
        <div class="gallery-heading">
          <h2 id="photos-heading">Photos</h2>
        </div>
        <ul id="photos"></ul>
      </section>
    </section>
    <dialog id="photo-dialog" aria-labelledby="photo-title">
      <div class="photo-dialog-header">
        <h2 id="photo-title"></h2>
        <a id="photo-download" title="Download the original photo file" download>Download</a>
        <form method="dialog"><button type="submit" title="Close this photo and return to the gallery" autofocus>Close</button></form>
      </div>
      <div class="photo-dialog-image">
        <img id="photo-full" alt="" hidden>
        <div id="photo-loading" class="photo-loading" hidden>
          <p id="photo-percent">Loading photo…</p>
          <progress id="photo-progress" max="100" aria-label="Photo loading progress"></progress>
          <p id="photo-bytes"></p>
        </div>
        <p id="photo-status" role="status"></p>
      </div>
    </dialog>
    <noscript>Enable JavaScript to open the camera viewer.</noscript>
  </main>
</body>
</html>
