<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sony Live Camera</title>
  <link rel="stylesheet" href="/viewer.css">
  <script src="/viewer.js" type="module"></script>
</head>
<body>
  <main>
    <header>
      <h1>Sony Live Camera</h1>
      <div class="header-actions">
        <button id="lock" type="button" hidden>Lock</button>
        <button id="open-admin-menu" type="button" popovertarget="admin-menu" aria-label="Camera administration" hidden><span aria-hidden="true">☰</span></button>
      </div>
    </header>
    <form id="unlock" hidden>
      <label for="password">Admin password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
      <button type="submit">Open as admin</button>
    </form>
    <form id="invite" hidden>
      <button type="submit">Accept camera invitation</button>
    </form>
    <p id="status" role="status"></p>
    <section id="camera" hidden>
      <section class="preview-panel" aria-label="Camera preview">
        <div class="preview">
          <img id="preview" alt="Latest camera preview" hidden>
          <p id="preview-status" role="status">Waiting for the camera…</p>
        </div>
        <div class="preview-toolbar">
          <span>Live preview</span>
          <button id="capture-photo" type="button" aria-label="Take photo" title="Take photo" hidden></button>
          <p id="capture-status" role="status"></p>
        </div>
      </section>
      <section id="admin" hidden>
        <div class="settings-heading">
          <h2>Camera settings</h2>
        </div>
        <div id="settings"></div>
        <p id="settings-status" role="status"></p>
      </section>
      <section id="admin-menu" popover aria-labelledby="admin-menu-title">
        <div class="settings-heading">
          <h2 id="admin-menu-title">Camera administration</h2>
          <button type="button" popovertarget="admin-menu" popovertargetaction="hide" aria-label="Close administration">Close</button>
        </div>
        <p><a href="/controls">Back to camera controls</a></p>
        <details>
          <summary>Camera access</summary>
          <button id="show-admin-qr" type="button">Show admin login QR code</button>
          <div id="admin-qr" class="access-qr" role="img" aria-label="QR code for the camera admin login" hidden></div>
        </details>
        <details>
          <summary>Viewer invitations</summary>
          <form id="issue">
            <label for="confirm-password">Admin password</label>
            <input id="confirm-password" type="password" autocomplete="current-password" required>
            <button type="submit">Create single-use invitation</button>
            <label for="invite-link" hidden>Invitation link</label>
            <input id="invite-link" type="text" readonly hidden>
            <div id="invite-qr" class="access-qr" role="img" aria-label="QR code for the single-use viewer invitation" hidden></div>
          </form>
          <div id="viewer-sessions"></div>
        </details>
        <details>
          <summary>Scheduled captures</summary>
          <form id="schedule">
            <fieldset id="schedule-fields" disabled>
              <label><input id="schedule-enabled" type="checkbox"> Enable daily captures</label>
              <label for="schedule-times">Daily capture times</label>
              <input id="schedule-times" type="text" placeholder="08:00, 17:30" required>
              <label for="schedule-zone">Time zone</label>
              <input id="schedule-zone" type="text" placeholder="America/Chicago" required>
              <button type="submit">Save schedule</button>
            </fieldset>
          </form>
        </details>
        <details>
          <summary>AI advice for scheduled captures</summary>
          <form id="ai">
            <label><input id="ai-enabled" type="checkbox"> Analyze a preview before each scheduled shot</label>
            <label><input id="ai-required" type="checkbox"> Require AI advice before capture</label>
            <label for="ai-provider">Provider</label>
            <select id="ai-provider"><option value="">Choose provider</option></select>
            <label for="ai-model">Vision model</label>
            <input id="ai-model" type="text" maxlength="120">
            <label for="ai-key">Provider API key</label>
            <input id="ai-key" type="password" maxlength="4096" autocomplete="off">
            <label for="ai-prompt">Photo goal</label>
            <textarea id="ai-prompt" maxlength="2000" rows="4"></textarea>
            <button type="submit">Save AI settings</button>
            <button id="check-ai" type="button">Check saved API key</button>
          </form>
        </details>
        <p id="admin-status" role="status"></p>
      </section>
      <section class="gallery" aria-labelledby="photos-heading">
        <div class="gallery-heading">
          <h2 id="photos-heading">Photos</h2>
        </div>
        <ul id="photos"></ul>
      </section>
    </section>
    <dialog id="photo-dialog" aria-labelledby="photo-title">
      <div class="photo-dialog-header">
        <h2 id="photo-title"></h2>
        <a id="photo-download" download>Download</a>
        <form method="dialog"><button type="submit" autofocus>Close</button></form>
      </div>
      <div class="photo-dialog-image">
        <img id="photo-full" alt="" hidden>
        <p id="photo-status" role="status"></p>
      </div>
    </dialog>
    <noscript>Enable JavaScript to open the camera viewer.</noscript>
  </main>
</body>
</html>
